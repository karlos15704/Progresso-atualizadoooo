    <!-- WebSocket Insecure Mixed Content Guard -->
    <script>
      (function() {
        if (typeof window !== 'undefined' && window.location.protocol === 'https:') {
          var OriginalWebSocket = window.WebSocket;
          window.WebSocket = function(url, protocols) {
            if (typeof url === 'string' && url.startsWith('ws://')) {
              console.warn('[WebSocket Guard] Suppressing insecure WebSocket connection on HTTPS:', url);
              var mockWs = {
                url: url,
                readyState: 3, // CLOSED
                bufferedAmount: 0,
                extensions: '',
                protocol: '',
                binaryType: 'blob',
                CONNECTING: 0,
                OPEN: 1,
                CLOSING: 2,
                CLOSED: 3,
                close: function() {},
                send: function() {},
                addEventListener: function() {},
                removeEventListener: function() {},
                dispatchEvent: function() { return false; },
                onopen: null,
                onclose: null,
                onerror: null,
                onmessage: null
              };
              return mockWs;
            }
            return new OriginalWebSocket(url, protocols);
          };
          window.WebSocket.prototype = OriginalWebSocket ? OriginalWebSocket.prototype : {};
          window.WebSocket.CONNECTING = 0;
          window.WebSocket.OPEN = 1;
          window.WebSocket.CLOSING = 2;
          window.WebSocket.CLOSED = 3;
        }
      })();
    </script>
